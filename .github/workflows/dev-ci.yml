name: dev 브랜치 CI 스크립트

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  testing-stage:
    name: Perform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v3

      # JDK 17 + 21 둘 다 설치 → 현재 toolchain(17) 및 추후 21 승격 모두 대응
      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
          cache: gradle

      - name: read secrets
        run: echo "$FIREBASE_PRIVATE_KEY_JSON" > src/main/resources/firebase-private-key.json
        env:
          FIREBASE_PRIVATE_KEY_JSON: ${{ secrets.FIREBASE_PRIVATE_KEY_JSON }}

      # github actions cache로부터 의존성 및 빌드 캐시 기져옴
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        shell: bash

      # 테스트 실행 (Gradle toolchain 이 설치된 17/21 을 모두 인식하도록 fromEnv 전달)
      - name: Run tests
        run: |
          ./gradlew test \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
        shell: bash

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ${{ github.workspace }}/build/test-results/**/*.xml

      - name: JUnit Report Action
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ${{ github.workspace }}/build/test-results/**/*.xml