# GhostRunner nginx upstream (Blue-Green 전환 대상)
#   설치 위치: /etc/nginx/conf.d/ghostrunner-upstream.conf
#   nginx.conf 의 http 블록이 conf.d/*.conf 를 include 하므로 자동 편입된다.
#   deploy.sh 가 배포마다 아래 포트(8080 <-> 8081)를 rewrite 하고 nginx 를 reload 한다.
#
#   sites-available/default 의 location / 에서 다음처럼 이 upstream 을 참조해야 한다:
#       proxy_pass http://ghostrunner_backend;
#   (setup.sh 가 기존 'proxy_pass http://localhost:8080;' 를 이 형태로 한 줄 교체한다)
upstream ghostrunner_backend {
    server 127.0.0.1:8080;
}
